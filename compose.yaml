services:
  swetrix:
    image: swetrix/swetrix-fe:v5.2.1
    restart: always
    depends_on:
      - swetrix-api
    environment:
      - BASE_URL=${BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ping || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swetrix.rule=Host(`swetrix.vivemo.se`)"
      - "traefik.http.routers.swetrix.entrypoints=websecure"
      - "traefik.http.routers.swetrix.tls.certresolver=letsencrypt"
      - "traefik.http.services.swetrix.loadbalancer.server.port=3000"

  swetrix-api:
    image: swetrix/swetrix-api:v5.2.1
    restart: always
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - BASE_URL=${BASE_URL}
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION}
      - DEBUG_MODE=false
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CLICKHOUSE_HOST=http://clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=analytics
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5005/ping || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swetrix-api.rule=Host(`swetrix.vivemo.se`) && PathPrefix(`/backend`)"
      - "traefik.http.routers.swetrix-api.entrypoints=websecure"
      - "traefik.http.routers.swetrix-api.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.swetrix-api-stripprefix.stripprefix.prefixes=/backend"
      - "traefik.http.routers.swetrix-api.middlewares=swetrix-api-stripprefix"
      - "traefik.http.services.swetrix-api.loadbalancer.server.port=5005"

  redis:
    image: redis:8.6-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 30s
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: always
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 30s
      start_period: 60s
    cap_add:
      - SYS_NICE
    volumes:
      - swetrix-events-data:/var/lib/clickhouse
      - ./clickhouse/reduce-logs.xml:/etc/clickhouse-server/config.d/reduce-logs.xml:ro
      - ./clickhouse/disable-user-logging.xml:/etc/clickhouse-server/users.d/disable-user-logging.xml:ro
      - ./clickhouse/preserve-ram-config.xml:/etc/clickhouse-server/config.d/preserve-ram-config.xml:ro
      - ./clickhouse/preserve-ram-user.xml:/etc/clickhouse-server/users.d/preserve-ram-user.xml:ro

volumes:
  swetrix-events-data:
    driver: local
